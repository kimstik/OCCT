name: perf-lab

on:
  push:
    branches: [perf-lab]
  workflow_dispatch:

concurrency:
  group: perf-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-noexc
            cc: gcc
            cxx: g++
            disable_exceptions: "ON"
          - name: gcc-nointerpose
            cc: gcc
            cxx: g++
            extra: "-fno-semantic-interposition"
          - name: gcc-bsymbolic
            cc: gcc
            cxx: g++
            extra_ld: "-Wl,-Bsymbolic-functions"
          - name: gcc-nohardening
            cc: gcc
            cxx: g++
            extra: "-fno-stack-protector -U_FORTIFY_SOURCE -fcf-protection=none"
          - name: gcc-flags
            cc: gcc
            cxx: g++
            extra: "-fno-semantic-interposition -fipa-pta -fdevirtualize-at-ltrans -fno-math-errno -fno-trapping-math -fno-stack-protector -U_FORTIFY_SOURCE"
            extra_ld: "-Wl,-Bsymbolic-functions"
          - name: gcc-dim32
            cc: gcc
            cxx: g++
            patch: plib-dim32.sh
          - name: gcc-epsilon
            cc: gcc
            cxx: g++
            patch: epsilon-bits.sh
          - name: gcc-nomatherrno
            cc: gcc
            cxx: g++
            extra: "-fno-math-errno"
          - name: gcc-haswell
            cc: gcc
            cxx: g++
            march: haswell
          - name: gcc-pgo
            cc: gcc
            cxx: g++
            pgo: "1"
          - name: clang
            cc: gcc
            cxx: g++
            var_cc: clang
            var_cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache linux-tools-common linux-tools-generic clang llvm
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1)
          if [ -n "$PERF" ]; then sudo ln -sf "$PERF" /usr/local/bin/perf; fi
          perf --version || echo "no perf"
          nproc; ${{ matrix.cxx }} --version | head -1; cmake --version | head -1

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: perf-lab-${{ matrix.name }}
          restore-keys: perf-lab-
          max-size: 3G

      - name: Build and measure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          VAR_CC: ${{ matrix.var_cc || matrix.cc }}
          VAR_CXX: ${{ matrix.var_cxx || matrix.cxx }}
          MARCH: ${{ matrix.march || 'nocona' }}
          DISABLE_EXCEPTIONS: ${{ matrix.disable_exceptions || 'OFF' }}
          LTO: ${{ matrix.lto || 'TRUE' }}
          EXTRA_CXXFLAGS: ${{ matrix.extra || '' }}
          EXTRA_LDFLAGS: ${{ matrix.extra_ld || '' }}
          PATCH: ${{ matrix.patch || '' }}
          PGO: ${{ matrix.pgo || '0' }}
        run: bash perf-lab/run.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-lab-${{ matrix.name }}
          path: |
            perf-lab/out/*.txt
            perf-lab/out/*.log
          if-no-files-found: warn
